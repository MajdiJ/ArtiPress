<!--
This is an example article list template.
You can use this as a base and modify it, or take the variables and sections and pase them into your own template.
If you do bring/create your own, make sure to update the template path in the config file to point to your new template.

If you try and preview this template without running the generator, you will see the variable names in curly brackets. These are the variables that ArtiPress will replace with actual values.

The variables/sections that you must include in your article list template are:
- `article_list_styling_and_scripts` -> Styling (CSS) and scripts (JS) for the article list. Place in the <head>. Edit as needed.
- `article_list_items`               -> The rendered article card grid HTML. Place where you want the list to appear.

Direct variables also available for use anywhere in this template:
- `base_url`      -> The site base URL (e.g. https://example.com).
- `website_title` -> The site name from config.
- `output_path`   -> The output folder name (e.g. articles).
- `assets_url`    -> URL prefix for shared assets (e.g. /articles/_artipress).

These variables must be put in {html_var(...)} format.

You can edit the `article_list_cards.css` styling to fit your site. Some other styling files are not recommended to be edited.
You can edit the article card layout in the `article_list_item.html` template component.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Tag(s) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" href="{html_var(assets_url)}/branding/favicon.png" />

    <!-- Site specific meta tags -->
    <title>Articles - ArtiPress</title>
    <link rel="canonical" href="{html_var(base_url)}/articles" />
    <meta name="description" content="Static site article generator and builder without a backened database." />

    <!-- Style(s) -->
    <link rel="stylesheet" href="{html_var(assets_url)}/style/main.css" />

    <!-- === ArtiPress ===
    You must include variable/section below in your article list template (In the <head> section) -->
    {html_var(article_list_styling_and_scripts)}
    <!-- END ArtiPress (End of needed section)-->

</head>

<body>

    <header class="articles-page-header">
        <a href="/" class="site-logo-link" aria-label="ArtiPress home">
            <img src="{html_var(assets_url)}/branding/logo.png" alt="" class="site-logo" />
            <span class="site-logo-name">ArtiPress</span>
        </a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/articles">All Articles</a></li>
                <li><a href="/articles/authors">Authors</a></li>
            </ul>
        </nav>
    </header>

    <main class="articles-list-page-main">

        <div class="page-section page-section-projects" id="projects-header">
            <h2>Articles</h2>
        </div>

        <!-- === ArtiPress ===
        You must include variable/section below in your article list template (In the <body> section, where you want the list of articles to be rendered) -->
        {html_var(article_list_items)}
        <!-- END ArtiPress (End of needed section)-->

    </main>

    <footer>
        <div class="container-page-content-width">
            <p>
                &copy; 2026 ArtiPress. All rights reserved.
            </p>
        </div>
    </footer>
</body>

</html>
