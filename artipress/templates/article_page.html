<!--
This is an example article page template.
You can use this as a base and modify it, or take the variables and sections and pase them into your own template.
If you do bring/create your own, make sure to update the template path in the config file to point to your new template.

If you try and preview this template without running the generator, you will see the variable names in curly brackets. These are the variables that ArtiPress will replace with actual values.

The variables/sections that you must include in your article page template are:
- `article_page_head_metadata`            -> (head, near top) Title, canonical, meta description, OG tags, Twitter Card. Do not place other meta tags above this.
- `articles_page_styling_and_scripts`     -> (head, middle) Styling (CSS) and scripts (JS) for the article page. Edit as needed.
- `article_page_head_application_json_ld` -> (head, bottom) JSON-LD structured data script tag for SEO.
- `article_page_main_article`             -> (main) The full article content — header, sharing bar, image, body, footer.

Optional variables/sections:
- `related_articles` -> (main, after the article) A <section> containing the "Related articles" heading and card grid. Empty string when `related_articles_count` is 0 in config or there are no other articles to show.

Direct variables also available for use anywhere in this template:
- `article_title`  -> The article title string.
- `website_title`  -> The site name from config.
- `base_url`       -> The site base URL (e.g. https://example.com).
- `output_path`    -> The output folder name (e.g. articles).
- `assets_url`     -> URL prefix for shared assets (e.g. /articles/_artipress).
- `article_id`     -> The article slug (e.g. my-article).

These variables must be put in {html_var(...)} format.

You can edit the `article_main_element.css` and `article_md_elements.css` styling to fit your site.
You can edit the article layout in the `article_page_main_article.html` template component.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Tag(s) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="index, follow">


    <!-- === ArtiPress ===
    You must include variable/section below in your article list template (In the <head> section, near the top)
    Make sure not to add any other meta tags / metadata that may override what's added below -->
    {html_var(article_page_head_metadata)}
    <!-- END ArtiPress (End of needed section)-->

    <!-- Style(s) -->
    <link rel="stylesheet" href="{html_var(assets_url)}/style/main.css" />

    <!-- === ArtiPress ===
    You must include variable/section below in your article list template (In the <head> section, in the middle) -->
    {html_var(articles_page_styling_and_scripts)}
    <!-- END ArtiPress (End of needed section)-->

    <!-- === ArtiPress ===
    You must include variable/section below in your article list template (In the <head> section, at the bottom) -->
    {html_var(article_page_head_application_json_ld)}
    <!-- END ArtiPress (End of needed section)-->

</head>

<body>

    <header class="articles-page-header">
        <h1><a href="/">ArtiPress</a></h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/articles">All Articles</a></li>
                <li><a href="/articles/authors">Authors</a></li>
            </ul>
        </nav>
    </header>

    <main class="articles-page-main">

        <!-- You are recommended to put the article main content var within a div with a class, and style the article layout/size using that class -->

        <div class="artipress-article-container">
            <!-- === ArtiPress ===
            You must include variable/section below in your article page template (In the <main> section, where you want the article content to appear) -->
            {html_var(article_page_main_article)}
            <!-- END ArtiPress (End of needed section)-->
        </div>

        <!-- === ArtiPress ===
        Optional: drop in the related-articles section here. Renders as empty string when disabled or when no candidates exist. -->
        {html_var(related_articles)}
        <!-- END ArtiPress -->

    </main>

    <footer>
        <div class="container-page-content-width">
            <p>
                &copy; 2026 ArtiPress. All rights reserved.
            </p>
        </div>
    </footer>
</body>

</html>
